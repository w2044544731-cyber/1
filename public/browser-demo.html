<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品流 · 浏览器操作演示</title><link rel="stylesheet" href="/style.css"><script type="module" src="/browser-demo.js"></script></head>
<body class="browser-training"><main><p class="eyebrow">LOCAL BROWSER TRAINING</p><h1>采集箱操作演示</h1><p class="notice">这是软件自带的演示页面。所有保存和发布都留在本机，不操作真实店铺；这里的按钮定位不适用于妙手真实页面。</p><nav class="browser-toolbar"><a href="/browser-demo/editor?id=101">演示杯子</a><a href="/browser-demo/editor?id=102">演示收纳盒</a></nav><section class="panel browser-content"><h2 id="shop">店铺：演示店铺 7</h2><p id="identity"></p><div class="form-grid"><label>商品标题<input id="title" readonly></label><label>SKU<input id="sku" readonly></label><label>分类<input id="category" readonly></label><label>上传替换主图<input id="upload" type="file" accept="image/png"></label></div><div class="image-grid"><figure><div class="image-frame"><img id="original" src="/browser-demo/source.png" alt="原图"></div><figcaption>采集原图</figcaption></figure><figure><div class="image-frame"><img id="replacement" alt="待保存的场景图" hidden></div><figcaption>替换图</figcaption></figure></div><div class="browser-toolbar"><button id="save" class="secondary">保存图片</button><button id="publish" class="primary">提交发布任务</button></div><p id="save-result" role="status"></p><p id="publish-result" role="status"></p></section></main></body></html>
