<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日清单</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">一步一步，完成今天</p>
    <h1>今日清单</h1>
    <p class="intro">把要做的事记下来，给每一个小进展打个勾。</p>
    <form id="task-form">
      <label class="sr-only" for="task-input">新的待办事项</label>
      <input id="task-input" placeholder="接下来想完成什么？" maxlength="200" required autocomplete="off">
      <button type="submit">添加</button>
    </form>
    <div class="toolbar"><span id="count" aria-live="polite"></span><button id="clear" type="button">清除已完成</button></div>
    <ul id="tasks" aria-label="待办清单"></ul>
    <p id="empty" class="empty">清单还是空的，添加第一件事吧。</p>
    <p id="status" role="status"></p>
    <footer>数据仅保存在当前浏览器，无需登录。</footer>
    <noscript>请启用 JavaScript 以使用待办清单。</noscript>
  </main>
</body>
</html>
